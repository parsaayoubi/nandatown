# SPDX-License-Identifier: Apache-2.0
# Delegated-auth scenario: a coordinator mints scoped, short-lived sub-tokens
# for three intermediaries, each of which further delegates to leaf agents.
# Exercises attenuation (scope subset), TTL clamping, audience binding, and
# cascading revocation across a 3-level delegation tree.
name: delegated_auth
description: |
  A coordinator holds a root capability token. It delegates narrower tokens
  to 3 intermediaries; each intermediary delegates to 4 leaf agents (12 total).
  Revoking an intermediary must invalidate that subtree's leaves while leaving
  the other subtrees and the coordinator untouched.
tier: 1
seed: 42
agents:
  count: 16
  brain: state-machine
  roles:
    - name: coordinator
      count: 1
    - name: intermediary
      count: 3
    - name: leaf
      count: 12
layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: delegatable
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1
task:
  type: delegated_auth
  config:
    rounds: 10
failures:
  message_drop: 0.0
  byzantine_agents: 0.0
duration: "ticks: 10000"
metrics:
  - message_count
  - agent_count
output:
  trace: ./traces/delegated_auth.jsonl
